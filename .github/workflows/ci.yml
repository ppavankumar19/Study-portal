name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check server.js syntax
        run: node --check server.js

      - name: Validate package.json
        run: node -e "require('./package.json'); console.log('package.json is valid JSON')"

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "secret123\|change-this-secret-key" --include="*.js" --include="*.html" .; then
            echo "WARNING: Detected hardcoded default credentials in source files."
            echo "Please use environment variables (ADMIN_PASS, COOKIE_SECRET) instead."
          fi
